# Furnace burn time, for the Ignite ability.
# litTime/litDuration are package-private on AbstractFurnaceBlockEntity, and there
# is no public API for "start this furnace burning for N ticks" — the ContainerData
# that exposes them is protected too.
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litTime
public net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity litDuration
